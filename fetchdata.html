<script src="js/nn.min.js"></script>
<script>
  /* global nn */

  async function setup () {
    // fetch a random image from a sub-breed (golden retriever, not hound)
    const url = 'https://dog.ceo/api/breed/husky/images/random'
    const res = await fetch(url)
    const data = await res.json()
    // press F12 to open console (fn + F12 on mac)
    console.log(data)
    // create an <img> and add it to the page
    nn.create('img')
      .set('src', data.message)
      .css('width', 500)            // 1. width: 300 -> 500
      .addTo('body')
  }

  nn.on('load', setup)
  nn.on('click', setup)

</script>
